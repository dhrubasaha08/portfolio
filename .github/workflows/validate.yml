name: Validate portfolio

on:
  pull_request:
    branches: [dev]
  push:
    branches: ["agent/**"]
  workflow_dispatch:

concurrency:
  group: portfolio-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate with Node.js 22
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate application and production build
        run: npm run check

      - name: Verify custom domain artifact
        shell: bash
        run: |
          test -f dist/CNAME
          test "$(cat dist/CNAME)" = "dhrubasaha.co.in"
